# =============================================================================
# Shiny Server 配置
# 适配 ADaM Builder：单应用 + 长时间 LLM 请求
# =============================================================================

run_as shiny;

server {
  listen 3838;

  location / {
    # app_dir：挂载单一应用，更安全（不会暴露目录结构）
    app_dir /srv/shiny-server/adam;
    log_dir /var/log/shiny-server;
  }

  # 应用空闲超时：10 分钟无操作后休眠（秒为单位）
  app_idle_timeout 600;
}
