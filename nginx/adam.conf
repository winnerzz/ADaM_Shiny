# =============================================================================
# Nginx 反向代理配置 — ADaM Builder
#
# 部署步骤：
#   1. 将本文件复制到 /etc/nginx/sites-available/adam
#   2. 替换 your-domain.com 为实际域名
#   3. sudo ln -s /etc/nginx/sites-available/adam /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d your-domain.com   # 自动配置 SSL
#   5. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # SSL 证书（由 certbot 自动填写）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 推荐的 SSL 安全配置
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -------------------------------------------------------------------------
    # 访问控制：仅内部用户，可启用 IP 白名单（取消注释并填写实际 IP）
    # -------------------------------------------------------------------------
    # allow 203.0.113.0/24;   # 公司/团队网段
    # deny all;

    # 上传大文件（SDTM CSV 可能较大，设 100MB）
    client_max_body_size 100M;

    # 安全响应头
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3838;

        # ── Shiny WebSocket 升级（必须，否则应用无法正常工作）──
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ── 请求头透传 ──────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 超时设置：适配长时间 LLM 请求 ────────────────────────
        # 应用内最长 request_timeout 为 240s，Nginx 设为 300s 留出缓冲
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;

        # 禁止 Nginx 缓冲流式响应（Shiny 实时输出）
        proxy_buffering off;
    }
}
